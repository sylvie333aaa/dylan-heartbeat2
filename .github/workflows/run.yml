name: Run Heartbeat

on:
  schedule:
    - cron: '0 */1 * * *' # 每 1 小时自动跑一次
  workflow_dispatch: # 允许手动点击按钮测试

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Heartbeat
        env:
          # ========== 核心必填项 ==========
          # 你的 Railway 域名
          GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          # 你的网关密码（保护你的服务不被白嫖）
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          # 时区（保证自动发消息的时间准确）
          TIME_ZONE: Asia/Shanghai
          
          # ========== 附加功能（天气注入） ==========
          # 是否启用天气（填 true 或 false）
          WEATHER_ENABLED: true
          # 你的纬度
          WEATHER_LAT: 29.8°N
          # 你的经度
          WEATHER_LON: 121.5°E
          
          
        run: node wake_up.js
