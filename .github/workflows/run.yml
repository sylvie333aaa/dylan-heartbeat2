name: Run Heartbeat

on:
  schedule:
    - cron: '0 */1 * * *' # 每1小时运行一次
  workflow_dispatch: # 允许手动触发测试

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Heartbeat
        env:
          # 1. 核心 API 配置
          TARGET_API_URL: ${{ secrets.TARGET_API_URL }}
          TARGET_API_KEY: ${{ secrets.TARGET_API_KEY }}
          MODEL_NAME: deepseek-chat
          
          # 2. 网关配置
          GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_USER: hh
          
          # 3. 天气配置 (已为你开启)
          WEATHER_ENABLED: 'true'
          WEATHER_LAT: '29.8683' # 宁波纬度
          WEATHER_LON: '121.5440' # 宁波经度
          
          # 4. Bark 推送配置
          PUSH_PROVIDER: 'bark'
          BARK_KEY: QJ4SUnGRxdL4od5yFzebtC
          
          # 5. 基础配置
          TIME_ZONE: Asia/Shanghai
          DATA_DIR: /tmp/data
        run: node wake_up.js
