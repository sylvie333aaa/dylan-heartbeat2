name: Dylan Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Heartbeat
        run: |
          touch .env
          echo "RAILWAY_STATIC_URL=https://dylan-heartbeat2-production.up.railway.app" >> .env
          echo "TARGET_API_URL=https://dylan-heartbeat2-production.up.railway.app/v1/chat/completions" >> .env
          echo "UPSTREAM_API_KEY=${{ secrets.APIKEY }}" >> .env
          echo "BARK_KEY=QJ4SuNgRxdL4od5yFzebtC" >> .env
          echo "AI_NAME=白越" >> .env
          echo "USER_NAME=vv大小姐" >> .env
          echo "WEATHER_ENABLED=true" >> .env
          echo "WEATHER_LOCATION_NAME=Ningbo" >> .env
          node wake_up.js
