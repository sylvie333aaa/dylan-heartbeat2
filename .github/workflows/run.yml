name: Dylan Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Heartbeat
        env:
          RAILWAY_ENABLED: "true"
          GATEWAY_BASE_URL: "https://dylan-heartbeat2-production.up.railway.app"
          GATEWAY_API_KEY: "qwertyuiop"
          UPSTREAM_API_KEY: "${{ secrets.APIKEY }}"
          AI_NAME: "白越"
          USER_NAME: "vv大小姐"
          BARK_KEY: "QJ4SuNgRxdL4od5yFzebtC"
          WEATHER_ENABLED: "true"
          WEATHER_LOCATION_NAME: "Ningbo"
        run: node wake_up.js

