name: Run Heartbeat

on:
  schedule:
    - cron: '0 */1 * * *' # 每1小时运行一次
  workflow_dispatch: # 允许手动触发测试

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Heartbeat
        env:
          # ==========================================
          # 1. 核心 API 配置（直连上游）
          # ==========================================
          TARGET_API_URL: ${{ secrets.TARGET_API_URL }}
          TARGET_API_KEY: ${{ secrets.TARGET_API_KEY }}
          MODEL_NAME: deepseek-chat
          
          # ==========================================
          # 2. 网关配置（备用）
          # ==========================================
          GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          
          # ==========================================
          # 3. 天气配置 (解决你日志里的报错)
          # ==========================================
          WEATHER_ENABLED: 'true'
          WEATHER_LAT: '29.8' # 纬度 (这里默认填的上海，你可以改成你所在的城市)
          WEATHER_LON: '121.5' # 经度
          
          # ==========================================
          # 4. Bark 推送配置 (让你手机收到消息)
          # ==========================================
          PUSH_PROVIDER: 'bark'
          # ⚠️ 注意：你之前的截图泄露了真实的 Bark Key，建议去 Bark App 里重新生成一个，填在下方
          BARK_KEY: QJ4SUnGRxdL4od5yFzebtC
          # ==========================================
          # 5. 基础配置
          # ==========================================
          TIME_ZONE: Asia/Shanghai
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DATA_DIR: /data 
        run: node wake_up.js
