name: Dylan Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Heartbeat
        env:
          TARGET_API_URL=https://dylan-heartbeat2-production.up.railway.app/v1/chat/completions
          TARGET_API_KEY=${{ secrets.APIKEY }}
          GATEWAY_API_KEY=qwertyuiop
          MODEL_NAME=gemini-2.5-flash
          BARK_KEY=QJ4SUnGRxdL4od5yFzebtC
          CUSTOM_ICON_URL=https://你的图标URL（可选）
          ALLOW_PUBLIC_API=true
          PUSH_PROVIDER=bark
          NTFY_SERVER_URL=https://ntfy.sh
          NTFY_TOPIC=
          NTFY_TOKEN=
          NTFY_PRIORITY=
          NTFY_TAGS=
          DIARY_ENABLED=true
          DIARY_DIR=diary
          DATA_DIR=
          PUSH_TIMEOUT_MS=15000
          WAKE_UPSTREAM_TIMEOUT_MS=300000
          REQUEST_BODY_LIMIT_MB=50
          MULTIMODAL_MODE=passthrough
          DAY_WAKE_AFTER_MINUTES=45
          NIGHT_WAKE_AFTER_MINUTES=120
          DAY_CHECK_INTERVAL_MINUTES=10
          NIGHT_CHECK_INTERVAL_MINUTES=120
          WAKE_DAY_START_HOUR=8
          WAKE_DAY_END_HOUR=24
          WEATHER_ENABLED=true
          WEATHER_LOCATION_NAME=Ningbo
          WEATHER_LAT=29.8°N
          WEATHER_LON=121.5°E
          WEATHER_UNITS=metric
          PORT=3000
          GATEWAY_BASE_URL=http://dylan-heartbeat2-production.up.railway.app
          TIME_ZONE=Asia/Shanghai
          RESTART_COMMAND=pm2 restart gateway wake-up --update-env
          ADMIN_USER=hh
          ADMIN_PASSWORD=@Cfll2142005
          RAILWAY_ENABLED=true
          AI_NAME: "白越"
          USER_NAME: "vv大小姐"
         
          
        run: node wake_up.js
