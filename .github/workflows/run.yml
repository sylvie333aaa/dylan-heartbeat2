name: Dylan Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Heartbeat
        env:
          TARGET_API_URL: https://dylan-heartbeat2-production.up.railway.app/v1/chat/completions
          GATEWAY_API_KEY: qwertyuiop
          UPSTREAM_API_KEY: ${{ secrets.APIKEY }}
        run: node wake_up.js
