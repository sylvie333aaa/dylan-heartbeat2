name: Trigger Heartbeat

on:
  schedule:
    # GitHub 定时任务可能延迟；真正的唤醒间隔仍由 Railway 内的配置决定。
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dylan-heartbeat-wake
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger one wake cycle in Railway
        env:
          GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          ADMIN_USER: ${{ secrets.ADMIN_USER || 'hh' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${GATEWAY_BASE_URL:?请先在 GitHub Secrets 配置 GATEWAY_BASE_URL}"
          : "${ADMIN_PASSWORD:?请先在 GitHub Secrets 配置 ADMIN_PASSWORD}"

          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 360 \
            --request POST \
            --user "${ADMIN_USER}:${ADMIN_PASSWORD}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "${GATEWAY_BASE_URL%/}/admin/wake"
